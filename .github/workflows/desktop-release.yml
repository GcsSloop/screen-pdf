name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync desktop version from tag
        run: bash scripts/release/sync_release_metadata.sh --tag "${GITHUB_REF_NAME}"
      - name: Install desktop dependencies
        run: pnpm --dir program/desktop install --frozen-lockfile
      - name: Install OCR dependencies
        run: |
          brew update
          brew install tesseract ghostscript
      - name: Build temporary runtime tree
        run: |
          RUNTIME_DIR="$RUNNER_TEMP/screen-pdf-runtime"
          mkdir -p "$RUNTIME_DIR/macos/bin"
          cp "$(which python3)" "$RUNTIME_DIR/macos/bin/python3"
          cp "$(which tesseract)" "$RUNTIME_DIR/macos/bin/tesseract"
          cp "$(which gs)" "$RUNTIME_DIR/macos/bin/gs"
          echo "SCREEN_PDF_RUNTIME_SOURCE_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Package desktop app
        run: bash scripts/desktop/package_local_release.sh
        env:
          RELEASE_PLATFORM: macos
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: screen-pdf-macos
          path: release-assets/**

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync desktop version from tag
        shell: bash
        run: bash scripts/release/sync_release_metadata.sh --tag "${GITHUB_REF_NAME}"
      - name: Install desktop dependencies
        run: pnpm --dir program/desktop install --frozen-lockfile
      - name: Install OCR dependencies
        shell: powershell
        run: |
          choco install tesseract ghostscript -y
      - name: Build temporary runtime tree
        shell: powershell
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "screen-pdf-runtime"
          New-Item -ItemType Directory -Force -Path (Join-Path $runtimeDir "windows\bin") | Out-Null
          Copy-Item (Get-Command python.exe).Source (Join-Path $runtimeDir "windows\bin\python.exe")
          Copy-Item (Get-Command tesseract.exe).Source (Join-Path $runtimeDir "windows\bin\tesseract.exe")
          Copy-Item (Get-Command gswin64c.exe).Source (Join-Path $runtimeDir "windows\bin\gswin64c.exe")
          "SCREEN_PDF_RUNTIME_SOURCE_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package desktop app
        shell: bash
        run: bash scripts/desktop/package_local_release.sh
        env:
          RELEASE_PLATFORM: windows
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: screen-pdf-windows
          path: release-assets/**

  package-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync desktop version from tag
        run: bash scripts/release/sync_release_metadata.sh --tag "${GITHUB_REF_NAME}"
      - name: Install desktop dependencies
        run: pnpm --dir program/desktop install --frozen-lockfile
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            ghostscript \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Build temporary runtime tree
        run: |
          RUNTIME_DIR="$RUNNER_TEMP/screen-pdf-runtime"
          mkdir -p "$RUNTIME_DIR/linux/bin"
          cp "$(which python3)" "$RUNTIME_DIR/linux/bin/python3"
          cp "$(which tesseract)" "$RUNTIME_DIR/linux/bin/tesseract"
          cp "$(which gs)" "$RUNTIME_DIR/linux/bin/gs"
          echo "SCREEN_PDF_RUNTIME_SOURCE_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Package desktop app
        run: bash scripts/desktop/package_local_release.sh
        env:
          RELEASE_PLATFORM: linux
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: screen-pdf-linux
          path: release-assets/**

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - package-macos
      - package-windows
      - package-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        run: |
          bash scripts/release/generate_updater_manifest.sh \
            --tag "${GITHUB_REF_NAME}" \
            --assets-root release-assets \
            --output release-assets/latest.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**
